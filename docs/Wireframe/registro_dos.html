<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro_Dos</title>
</head>
<body>
    <div class="conteiner">
        <h1>Registrarse</h1>

        <label>Nombre de usuario
            <input type="text"
            placeholder="juan camilo">
        </label>
        
        <label>Contraseña
            <input type="password"
            placeholder="****************">
        </label>
        
        <label>Clave
            <input type="password" placeholder="numero de asociacion">
        </label>

        <button>Registrarse</button>
    </div>
</body>
</html>
